[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zaly-toolkits"
version = "0.1.0"
description = "Coleccion de toolkits internos (conexiones a BD, ...)."
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.0",
    "scikit-learn>=1.4",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]